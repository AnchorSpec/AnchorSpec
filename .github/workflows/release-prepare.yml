name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # manually cut a beta prerelease from main

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for npm OIDC trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'AnchorSpec/AnchorSpec' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Mints a short-lived token from the AnchorSpec Release GitHub App.
      # Replaces a PAT so there's nothing with an expiration date to rotate manually
      # (see CLAUDE.md "Release token" section for why/how).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # No explicit version input: pnpm/action-setup reads the pinned version
      # from package.json's "packageManager" field. Passing both caused
      # "Multiple versions of pnpm specified" and failed every release run
      # (see the v1.6.0 release-prepare failure on 2026-07-10, fixed in #57).
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # Node 24 includes npm 11.5.1+ required for OIDC
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Opens/updates the Version Packages PR; publishes when the Version PR merges
      - name: Create/Update Version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          title: 'chore(release): version packages'
          createGithubReleases: true
          publish: pnpm run release:ci
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # npm authentication handled via OIDC trusted publishing (no token needed)

      # Only fires on the run that actually publishes (i.e. the Version Packages
      # PR merge), not on the run that just opens/updates that PR.
      - name: Mint token scoped to www
        if: steps.changesets.outputs.published == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: www-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: www

      # Tells the www repo's sync-docs workflow a new version is ready to mirror.
      # See CLAUDE.md "Documentation" — this replaces the manual "copy docs/ into
      # www" step of the release checklist.
      - name: Notify www of published release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.www-token.outputs.token }}
        run: |
          set -euo pipefail
          version=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[0].version')
          gh api repos/AnchorSpec/www/dispatches \
            -f event_type=anchorspec-release \
            -f "client_payload[version]=$version"

  # Manually-dispatched beta prerelease from main: version is the next stable
  # release per pending changesets with a -beta.N suffix (e.g. v1.6.0-beta.1),
  # published to npm under the `beta` dist-tag and posted as a prerelease-flagged
  # GitHub Release. Changesets are left unconsumed, so the stable flow above is
  # unaffected. This job lives in this file because npm trusted publishing
  # authorizes a single workflow file per package.
  #
  # Users opt in with: npm install -g anchorspec@beta
  beta:
    if: github.repository == 'AnchorSpec/AnchorSpec' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # Node 24 includes npm 11.5.1+ required for OIDC
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Beta version = next stable version per pending changesets, plus a
      # -beta.N suffix that increments over existing beta tags for that version.
      - name: Compute beta version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin
          pnpm exec changeset status --output=changeset-status.json
          NEXT=$(node -p "JSON.parse(require('fs').readFileSync('changeset-status.json','utf8')).releases[0]?.newVersion ?? ''")
          rm changeset-status.json
          if [ -z "$NEXT" ]; then
            echo "No pending changesets on main - nothing to cut a beta from."
            exit 1
          fi
          N=1
          while true; do
            VERSION="${NEXT}-beta.${N}"
            TAG="v${VERSION}"
            TAG_EXISTS=false
            NPM_EXISTS=false
            RELEASE_EXISTS=false

            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              TAG_EXISTS=true
            fi
            if npm view "anchorspec@${VERSION}" version >/dev/null 2>&1; then
              NPM_EXISTS=true
            fi
            if gh release view "${TAG}" >/dev/null 2>&1; then
              RELEASE_EXISTS=true
            fi

            if [ "$TAG_EXISTS" = false ] && [ "$NPM_EXISTS" = false ] && [ "$RELEASE_EXISTS" = false ]; then
              break
            fi
            if [ "$RELEASE_EXISTS" = false ]; then
              echo "Resuming incomplete beta ${TAG}"
              break
            fi

            N=$((N + 1))
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Cutting ${TAG}"

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      # prepublishOnly runs the build. npm authentication handled via OIDC
      # trusted publishing (no token needed).
      - name: Publish to npm under the beta dist-tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "anchorspec@${VERSION}" version >/dev/null 2>&1; then
            echo "anchorspec@${VERSION} is already on npm; skipping publish."
            exit 0
          fi
          npm publish --tag beta

      - name: Tag and create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "${TAG}")
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "${TAG} already exists at ${TAG_SHA}, not current HEAD ${HEAD_SHA}."
              exit 1
            fi
          else
            git tag "${TAG}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists on origin; skipping tag push."
          else
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; skipping release creation."
          else
            gh release create "${TAG}" \
              --prerelease \
              --generate-notes \
              --title "${TAG}" \
              --notes "Beta prerelease. Install with \`npm install -g anchorspec@beta\`."
          fi
